[project]
name = "smart-batches"
version = "0.1.0"
description = "ACO-inspired pheromone-guided mini-batch sampling for conditioning neural network training"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "wandb>=0.18",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_batches"]

[tool.pytest.ini_options]
testpaths = ["tests"]
