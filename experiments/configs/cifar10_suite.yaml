# CIFAR-10 / ResNet-18 comparison (several hours on MPS; not part of the
# default run plan). rho lowered: augmentation adds score noise per view.
suite: cifar10_suite
seeds: [0, 1]
base:
  out_dir: results/cifar10_suite
  data:
    dataset: cifar10
  model:
    name: resnet18
  optim:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 5.0e-4
    scheduler: cosine
  train:
    batch_size: 128
    epochs: 40
    log_every: 100
    probe_interval: 2000
    acc_targets: [0.80, 0.85, 0.90, 0.93]
  sampling:
    warmup_epochs: 1
    pheromone:
      rho: 0.6
  wandb:
    enabled: true
variants:
  - name: epoch_shuffle
    set: {sampling.mode: epoch_shuffle}
  - name: uniform
    set: {sampling.mode: uniform_replacement}
  - name: pher_loss
    set: {sampling.mode: pheromone, sampling.pheromone.score: loss}
  - name: pher_grad
    set: {sampling.mode: pheromone, sampling.pheromone.score: grad_norm_proxy}
