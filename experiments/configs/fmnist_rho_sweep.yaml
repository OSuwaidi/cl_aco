# Soft vs hard pheromone assignment: tau <- (1-rho)*tau + rho*score.
# rho=1.0 is the original hard-assignment idea; rho<1 is the EMA generalization.
suite: fmnist_rho_sweep
seeds: [0, 1]
base:
  out_dir: results/fmnist_rho_sweep
  data:
    dataset: fashion_mnist
  model:
    name: small_cnn
  optim:
    name: adam
    lr: 1.0e-3
  train:
    batch_size: 128
    epochs: 15
    log_every: 50
    probe_interval: 500
  sampling:
    mode: pheromone
    warmup_epochs: 1
    pheromone:
      score: loss
  wandb:
    enabled: true
variants:
  - name: rho03
    set: {sampling.pheromone.rho: 0.3}
  - name: rho06
    set: {sampling.pheromone.rho: 0.6}
  - name: rho10
    set: {sampling.pheromone.rho: 1.0}
